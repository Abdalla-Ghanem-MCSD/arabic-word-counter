<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Count Tool For PPTX</title>
    <link rel="stylesheet" href="../CSS/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

</head>
<body>
    <div class="container">
        <img src="../CSS/IMG/default.png" alt="Logo" class="logo"> <!-- Add your logo here -->
        <h1>Word Count Tool for PPTX</h1>
        <input type="file" id="fileInput" accept=".pptx" />
        <button id="countButton">Count Words</button>
        <div id="pptxWordCountResult"></div> <!-- Changed from <p> to <div> for better formatting -->
    </div>
    <script src="../JS/scriptpP.js"></script>
</body>
</html>
