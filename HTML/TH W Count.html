<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Count Tool For Word</title>
    <link rel="stylesheet" href="../CSS/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
</head>
<body>
    <div class="container">
        <img src="../CSS/IMG/default.png" alt="Logo" class="logo">
        <h1>Word Count Tool</h1>

        <input type="file" id="fileInput" accept=".docx, .doc" />
        <br><br>
        
        <input type="checkbox" id="includeNumbers" checked>
        <label for="includeNumbers">Include numbers in word count</label>
        <br><br>

        <button id="countButton">Count Words</button>
        <pre id="result"></pre>
    </div>
    <script src="../JS/scripteW.js"></script>
</body>
</html>
